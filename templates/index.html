<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MNIST Digit Classifier</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #555;
        }

        canvas {
            display: block;
            margin: 25px auto;
            background: black;
            border: 3px solid #333;
            border-radius: 8px;
            cursor: crosshair;

            /* Allows drawing with finger on phone */
            touch-action: none;
        }

        button {
            padding: 12px 25px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        #predictBtn {
            background: #222;
            color: white;
        }

        #clearBtn {
            background: #ddd;
            color: black;
        }

        button:hover {
            opacity: 0.8;
        }

        #result {
            margin-top: 25px;
            font-size: 22px;
            font-weight: bold;
        }

        #confidence {
            margin-top: 10px;
            font-size: 18px;
            color: #555;
        }

    </style>

</head>


<body>

    <div class="container">

        <h1>MNIST Digit Classifier</h1>

        <p>Draw a handwritten digit from 0 to 9</p>

        <canvas
            id="canvas"
            width="280"
            height="280">
        </canvas>

        <button
            id="clearBtn"
            onclick="clearCanvas()">
            Clear
        </button>

        <button
            id="predictBtn"
            onclick="predictDigit()">
            Predict
        </button>

        <div id="result"></div>

        <div id="confidence"></div>

    </div>


    <script>

        const canvas =
            document.getElementById("canvas");

        const ctx =
            canvas.getContext("2d");

        let drawing = false;


        // -------------------------
        // Create black background
        // -------------------------

        ctx.fillStyle = "black";

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        // -------------------------
        // Drawing settings
        // -------------------------

        ctx.strokeStyle = "white";

        ctx.lineWidth = 20;

        ctx.lineCap = "round";

        ctx.lineJoin = "round";


        // -------------------------
        // Get drawing position
        // Works on laptop and phone
        // -------------------------

        function getPosition(event) {

            const rect =
                canvas.getBoundingClientRect();

            const scaleX =
                canvas.width / rect.width;

            const scaleY =
                canvas.height / rect.height;

            return {
                x:
                    (event.clientX - rect.left)
                    * scaleX,

                y:
                    (event.clientY - rect.top)
                    * scaleY
            };
        }


        // -------------------------
        // Start drawing
        // -------------------------

        canvas.addEventListener(
            "pointerdown",
            startDrawing
        );


        function startDrawing(event) {

            event.preventDefault();

            drawing = true;

            canvas.setPointerCapture(
                event.pointerId
            );

            const position =
                getPosition(event);

            ctx.beginPath();

            ctx.moveTo(
                position.x,
                position.y
            );
        }


        // -------------------------
        // Draw
        // -------------------------

        canvas.addEventListener(
            "pointermove",
            draw
        );


        function draw(event) {

            event.preventDefault();

            if (!drawing) {
                return;
            }

            const position =
                getPosition(event);

            ctx.lineTo(
                position.x,
                position.y
            );

            ctx.stroke();
        }


        // -------------------------
        // Stop drawing
        // -------------------------

        canvas.addEventListener(
            "pointerup",
            stopDrawing
        );

        canvas.addEventListener(
            "pointercancel",
            stopDrawing
        );


        function stopDrawing(event) {

            event.preventDefault();

            drawing = false;

            ctx.beginPath();
        }


        // -------------------------
        // Clear canvas
        // -------------------------

        function clearCanvas() {

            ctx.fillStyle = "black";

            ctx.fillRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

            document.getElementById(
                "result"
            ).innerHTML = "";

            document.getElementById(
                "confidence"
            ).innerHTML = "";
        }


        // -------------------------
        // Predict digit
        // -------------------------

        async function predictDigit() {

            const image =
                canvas.toDataURL(
                    "image/png"
                );


            const result =
                document.getElementById(
                    "result"
                );

            const confidence =
                document.getElementById(
                    "confidence"
                );


            result.innerHTML =
                "Predicting...";

            confidence.innerHTML = "";


            try {

                const response =
                    await fetch(
                        "/predict",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                image: image
                            })
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "Server error: " +
                        response.status
                    );
                }


                const data =
                    await response.json();


                if (data.error) {

                    throw new Error(
                        data.error
                    );
                }


                result.innerHTML =
                    "Predicted Digit: " +
                    data.digit;


                confidence.innerHTML =
                    "Confidence: " +
                    data.confidence +
                    "%";


            }

            catch (error) {

                console.error(
                    "Prediction error:",
                    error
                );


                result.innerHTML =
                    "Error connecting to server.";


                confidence.innerHTML =
                    "";
            }
        }

    </script>

</body>

</html>
